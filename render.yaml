services:
  - type: web
    name: cabinet-team-manager
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        value: smtp.office365.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        value: mohamed-aziz.jlassi@cabinet-jmh.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: "Cabinet JMH <mohamed-aziz.jlassi@cabinet-jmh.com>"
      - key: MAILBOX_USER
        value: cabinet.jmh.taches@gmail.com
      - key: MAILBOX_PASSWORD
        sync: false
      - key: MAILBOX_SERVER
        value: imap.gmail.com
      - key: MAILBOX_PORT
        value: "993"
      - key: MAILBOX_USE_SSL
        value: "true"
      - key: MAILBOX_FOLDER
        value: INBOX
      - key: MAILBOX_ALLOWED_SENDERS
        value: mohamed-aziz.jlassi@cabinet-jmh.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cabinet-team-manager-db
          property: connectionString
      - key: USE_POSTGRES
        value: "true"

databases:
  - name: cabinet-team-manager-db
    plan: free
    region: frankfurt
