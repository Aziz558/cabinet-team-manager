services:
  - type: web
    name: cabinet-team-manager
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        value: smtp.office365.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        value: mohamed-aziz.jlassi@cabinet-jmh.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: "Cabinet JMH <mohamed-aziz.jlassi@cabinet-jmh.com>"
      - key: MAILBOX_USER
        value: cabinet.jmh.taches@gmail.com
      - key: MAILBOX_PASSWORD
        sync: false
      - key: MAILBOX_SERVER
        value: imap.gmail.com
      - key: MAILBOX_PORT
        value: "993"
      - key: MAILBOX_USE_SSL
        value: "true"
      - key: MAILBOX_FOLDER
        value: INBOX
      - key: MAILBOX_ALLOWED_SENDERS
        value: mohamed-aziz.jlassi@cabinet-jmh.com, admin@cabinet-jmh.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        # Base hebergeee chez Neon (Postgres gratuit a vie) — valeur saisie
        # manuellement dans Render > Environment ; sync:false empeche le
        # blueprint d'ecraser cette valeur a chaque deploy.
        sync: false
      - key: USE_POSTGRES
        value: "true"

# databases:
#   (Render Postgres gratuit retire — expire au bout de 30 jours.
#    La base est desormais chez Neon: ep-hidden-credit-b1b5lypv, region eu-central-1)
