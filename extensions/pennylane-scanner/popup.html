<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #1a7f37;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #12592a;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
    }
    .ok { color: #1a7f37; }
    .ko { color: #cf222e; }
    #model {
      max-height: 200px;
    }
  </style>
</head>
<body>
  <h3>PennyLane Scanner</h3>
  <label for="apiKey">Clé API OpenRouter</label>
  <input id="apiKey" type="password" placeholder="sk-..." />
  <label for="model">Modèle LLM</label>
  <select id="model" disabled>
    <option value="">Entrez d'abord votre clé API</option>
  </select>
  <button id="save">Enregistrer</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
