name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lint Python (ruff — regles pieges)
        run: ruff check .

      - name: Verifier la syntaxe JS
        run: |
          node --check static/js/orbit-workspace.js
          node --check static/js/orbit-premium.js
          node --check static/js/orbit-space.js
          node --check static/js/app.js

      - name: Lancer les tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          curl -X POST "https://api.render.com/v1/services/srv-cabinet-team-manager/deploys" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d '{"clearCache": true}'

      - name: Wait for Deploy to Complete
        run: |
          sleep 30
