name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lint Python (ruff — regles pieges)
        run: ruff check .

      - name: Verifier la syntaxe JS
        run: |
          node --check static/js/orbit-workspace.js
          node --check static/js/orbit-premium.js
          node --check static/js/app.js

      - name: Lancer les tests
        run: pytest -q
