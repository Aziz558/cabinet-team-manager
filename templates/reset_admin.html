{% extends "base.html" %}
{% block title %}Réinitialisation admin{% endblock %}
{% block content %}
<div class="container-premium">
    <div class="login-card-premium" style="max-width:420px;margin:60px auto;">
        <div class="login-header-premium">
            <div class="login-icon-premium"><i class="bi bi-shield-lock"></i></div>
            <h2>Réinitialisation admin</h2>
            <p class="text-tertiary">Réinitialisez le mot de passe du compte <strong>admin@cabinet-jmh.com</strong>.</p>
        </div>
        <form method="POST" class="mt-3">
            <div class="form-group">
                <label for="reset_key">Clé de réinitialisation</label>
                <input type="text" id="reset_key" name="reset_key" class="input-premium-custom" required autofocus placeholder="Clé secrète">
            </div>
            <div class="form-group">
                <label for="new_password">Nouveau mot de passe</label>
                <input type="password" id="new_password" name="new_password" class="input-premium-custom" required minlength="4" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login w-100 mt-2">Réinitialiser le mot de passe</button>
        </form>
        <p class="text-center mt-3"><a href="{{ url_for('login') }}" class="text-orange-primary">Retour à la connexion</a></p>
    </div>
</div>
{% endblock %}
