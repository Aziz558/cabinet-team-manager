<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Cabinet JMH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-jmh.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo-jmh.png') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Premium animated orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
        }
        .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #FF8C00, transparent);
            top: -15%; left: -5%;
            animation: orbFloat1 30s ease-in-out infinite;
        }
        .orb-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #FF6B00, transparent);
            bottom: -20%; right: -10%;
            animation: orbFloat2 25s ease-in-out infinite reverse;
        }
        .orb-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #FFA726, transparent);
            top: 45%; left: 55%;
            animation: orbFloat3 20s ease-in-out infinite;
        }
        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(80px, -60px) scale(1.05); }
            66% { transform: translate(-40px, 80px) scale(0.95); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-70px, 50px) scale(1.05); }
            66% { transform: translate(50px, -70px) scale(0.95); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.08; }
            50% { transform: translate(-60px, -40px) scale(1.1); opacity: 0.16; }
        }

        /* Subtle grid overlay */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        /* Login container with entrance animation */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo img {
            width: 72px; height: 72px;
            border-radius: 18px;
            background: rgba(10,10,10,0.8);
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 1rem;
            transition: transform 0.4s ease;
        }
        .login-logo img:hover { transform: scale(1.04); }
        .login-logo h1 { font-weight: 700; font-size: 1.5rem; color: #fff; margin-bottom: 0.25rem; letter-spacing: -0.3px; }
        .login-logo .tagline { color: #666; font-size: 0.85rem; }
        .login-logo .tagline span { color: #FF8C00; }

        /* Login card */
        .login-card {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 2rem;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card.fade-out {
            opacity: 0;
            transform: scale(0.92) translateY(-20px);
        }

        .login-card .form-label { color: #888; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem; display: block; }
        .login-card .input-custom {
            width: 100%; padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; color: #fff;
            font-size: 0.9rem; font-family: 'Inter', sans-serif;
            outline: none; transition: all 0.25s ease;
        }
        .login-card .input-custom::placeholder { color: #444; }
        .login-card .input-custom:focus {
            border-color: rgba(255,140,0,0.3);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 3px rgba(255,140,0,0.08);
        }
        .login-card .form-group { margin-bottom: 1.25rem; }

        .btn-login {
            width: 100%; padding: 0.85rem;
            border: none; border-radius: 10px;
            background: linear-gradient(135deg, #FF8C00, #FFA726);
            color: #000; font-weight: 600; font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative; overflow: hidden;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,140,0,0.3); }
        .btn-login:active { transform: translateY(0); }
        /* Shine effect premium */
        .btn-login::after {
            content: '';
            position: absolute; top: 0; left: -80%;
            width: 50%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }
        .btn-login:hover::after { left: 130%; }

        /* Inputs avec icône */
        .input-wrap { position: relative; }
        .input-wrap > i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #555; font-size: 0.95rem; pointer-events: none; transition: color 0.25s ease;
        }
        .input-wrap:focus-within > i { color: #FF8C00; }
        .input-custom.with-icon { padding-left: 42px; }
        /* Toggle mot de passe */
        .pw-toggle {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #555; cursor: pointer; font-size: 0.95rem;
            transition: color 0.2s ease; padding: 4px;
        }
        .pw-toggle:hover { color: #FF8C00; }
        /* Badge sécurité discrète */
        .login-security { text-align: center; margin-top: 1.25rem; }
        .login-security span {
            display: inline-flex; align-items: center; gap: 6px;
            color: #444; font-size: 0.72rem; letter-spacing: 0.04em;
        }

        .login-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 1.25rem 0; }
        .login-footer { text-align: center; }
        .login-footer a { color: #666; text-decoration: none; font-size: 0.8rem; transition: color 0.2s ease; }
        .login-footer a:hover { color: #FF8C00; }

        .alert-custom { padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.8rem; margin-bottom: 1rem; }
        .alert-danger { background: rgba(239,83,80,0.1); color: #EF5350; border: 1px solid rgba(239,83,80,0.12); }
        .alert-success { background: rgba(76,175,80,0.1); color: #4CAF50; border: 1px solid rgba(76,175,80,0.12); }

        /* Improved portal effect */
        .portal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .portal-overlay.active { opacity: 1; }
        .portal-content {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 1001;
            opacity: 0;
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }
        .portal-content.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .portal-content img {
            width: 100px; height: 100px;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(255,140,0,0.25);
            animation: portalPulse 1.5s ease-in-out infinite;
        }
        @keyframes portalPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255,140,0,0.2); }
            50% { box-shadow: 0 0 80px rgba(255,140,0,0.35); }
        }
        .portal-content .portal-text {
            color: #FF8C00;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            opacity: 0;
            animation: textFadeIn 0.5s 0.5s forwards;
        }
        @keyframes textFadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(10px); }
        }
        .portal-loader {
            width: 24px; height: 24px;
            border: 2px solid rgba(255,140,0,0.2);
            border-top-color: #FF8C00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .login-container { padding: 1rem; }
            .login-card { padding: 1.5rem; }
            .login-logo img { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <!-- Animated orbs (improved) -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>

    <!-- Portal effect (improved) -->
    <div class="portal-overlay" id="portalOverlay"></div>
    <div class="portal-content" id="portalContent">
        <img src="{{ url_for('static', filename='img/logo-jmh.png') }}" alt="Cabinet JMH">
        <div class="portal-text">Cabinet JMH</div>
        <div class="portal-loader"></div>
    </div>

    <div class="login-container">
        <div class="login-logo">
            <img src="{{ url_for('static', filename='img/logo-jmh.png') }}" alt="Cabinet JMH">
            <h1>Cabinet JMH</h1>
            <p class="tagline">Gestion d'équipe <span>&amp;</span> comptabilité</p>
        </div>

        <div class="login-card" id="loginCard">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert-custom alert-{{ 'danger' if 'danger' in category else 'success' }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <div class="input-wrap">
                        <i class="bi bi-envelope"></i>
                        <input type="email" name="email" class="input-custom with-icon" required autofocus placeholder="vous@cabinet-jmh.com">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-wrap">
                        <i class="bi bi-shield-lock"></i>
                        <input type="password" name="password" class="input-custom with-icon" id="pwInput" required placeholder="••••••••">
                        <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" title="Afficher / masquer">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    Se connecter <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="login-divider"></div>

            <div class="login-footer">
                <a href="{{ url_for('team_select') }}"><i class="bi bi-arrow-left me-1"></i>Choisir une équipe</a>
            </div>
            <div class="login-security">
                <span><i class="bi bi-lock-fill"></i> CONNEXION SÉCURISÉE · CABINET JMH</span>
            </div>
        </div>
    </div>

    <script>
        // Toggle affichage mot de passe
        document.getElementById('pwToggle').addEventListener('click', function() {
            const inp = document.getElementById('pwInput');
            const ico = this.querySelector('i');
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            ico.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const card = document.getElementById('loginCard');
            const overlay = document.getElementById('portalOverlay');
            const content = document.getElementById('portalContent');

            card.classList.add('fade-out');

            setTimeout(() => {
                overlay.classList.add('active');
                setTimeout(() => content.classList.add('active'), 200);
            }, 300);

            setTimeout(() => { this.submit(); }, 1200);
        });
    </script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/static/sw.js'); }
var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault(); deferredPrompt = e;
    var btn = document.getElementById('installPwaBtn');
    if (btn) btn.style.display = 'inline-block';
});
document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'installPwaBtn' && deferredPrompt) { deferredPrompt.prompt(); }
});
</script>
</body>
</html>
