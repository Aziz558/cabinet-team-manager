<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Cabinet JMH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: #FF8C00;
            top: -20%; left: -10%;
            animation: orbFloat 25s ease-in-out infinite;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: #FF6B00;
            bottom: -15%; right: -10%;
            animation: orbFloat 30s ease-in-out infinite reverse;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: #FFA726;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbPulse 8s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(60px, -80px); }
            50% { transform: translate(-40px, 60px); }
            75% { transform: translate(30px, -30px); }
        }

        @keyframes orbPulse {
            0%, 100% { opacity: 0.08; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.18; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        /* Login container */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        /* Logo — BIGGER & PREMIUM */
        .login-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-logo .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 1.25rem;
        }
        .login-logo .logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 28px;
            background: conic-gradient(from 0deg, #FF8C00, transparent, #FF8C00, transparent);
            animation: logoSpin 4s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }
        @keyframes logoSpin {
            to { transform: rotate(360deg); }
        }
        .login-logo img {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: #0a0a0a;
            padding: 6px;
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }
        .login-logo img:hover {
            transform: scale(1.05);
        }
        .login-logo h1 {
            font-weight: 800;
            font-size: 1.75rem;
            color: #FFFFFF;
            margin-bottom: 0.25rem;
            letter-spacing: -0.5px;
        }
        .login-logo .tagline {
            color: #888888;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        .login-logo .tagline span {
            color: #FF8C00;
        }

        /* Login card — glassmorphism premium */
        .login-card {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 2.25rem;
            transition: all 0.4s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card.fade-out {
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
        }

        .login-card .form-label {
            color: #9E9E9E;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }

        .login-card .input-premium-custom {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.25s ease;
        }
        .login-card .input-premium-custom::placeholder {
            color: #555555;
        }
        .login-card .input-premium-custom:focus {
            border-color: rgba(255, 140, 0, 0.4);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        .login-card .form-group {
            margin-bottom: 1.25rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #FF8C00, #FFA726);
            color: #000000;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 140, 0, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login .btn-shimmer {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: shimmer 2.5s infinite;
        }
        @keyframes shimmer {
            to { left: 100%; }
        }

        .login-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 1.5rem 0;
        }

        .login-footer {
            text-align: center;
        }
        .login-footer a {
            color: #9E9E9E;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }
        .login-footer a:hover {
            color: #FF8C00;
        }

        .alert-custom {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .alert-danger-custom {
            background: rgba(239, 83, 80, 0.1);
            color: #EF5350;
            border: 1px solid rgba(239, 83, 80, 0.15);
        }
        .alert-success-custom {
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.15);
        }

        /* Portal effect */
        .portal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .portal-overlay.active {
            opacity: 1;
        }
        .portal-logo {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1001;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .portal-logo.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .portal-logo img {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            box-shadow: 0 0 80px rgba(255, 140, 0, 0.35);
        }
        .portal-logo .portal-text {
            color: #FF8C00;
            font-weight: 600;
            font-size: 1.2rem;
            opacity: 0;
            animation: portalTextIn 0.5s 0.4s forwards;
        }
        @keyframes portalTextIn {
            to { opacity: 1; }
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #FF8C00;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            animation: particleFloat 6s ease-in-out infinite;
        }
        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) scale(0); opacity: 0; }
            50% { transform: translateY(-100vh) scale(1); opacity: 0.6; }
        }

        @media (max-width: 480px) {
            .login-container { padding: 1rem; }
            .login-card { padding: 1.5rem; }
            .login-logo img { width: 72px; height: 72px; }
            .login-logo h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <!-- Animated orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>

    <!-- Particles -->
    <div class="particle" style="left:10%;top:80%;animation-delay:0s;"></div>
    <div class="particle" style="left:25%;top:60%;animation-delay:1.5s;"></div>
    <div class="particle" style="left:45%;top:70%;animation-delay:3s;"></div>
    <div class="particle" style="left:65%;top:85%;animation-delay:0.8s;"></div>
    <div class="particle" style="left:80%;top:55%;animation-delay:2.2s;"></div>
    <div class="particle" style="left:90%;top:90%;animation-delay:4s;"></div>

    <!-- Portal effect -->
    <div class="portal-overlay" id="portalOverlay"></div>
    <div class="portal-logo" id="portalLogo">
        <img src="{{ url_for('static', filename='img/logo-jmh.png') }}" alt="Cabinet JMH">
        <div class="portal-text">Cabinet JMH</div>
    </div>

    <div class="login-container">
        <div class="login-logo">
            <div class="logo-wrapper">
                <img src="{{ url_for('static', filename='img/logo-jmh.png') }}" alt="Cabinet JMH">
            </div>
            <h1>Cabinet JMH</h1>
            <p class="tagline">Gestion d'équipe <span>&amp;</span> comptabilité</p>
        </div>

        <div class="login-card" id="loginCard">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert-custom alert-{{ 'danger' if 'danger' in category else 'success' }}-custom">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <input type="email" name="email" class="input-premium-custom" required autofocus
                           placeholder="vous@cabinet-jmh.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="input-premium-custom" required
                           placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-shimmer"></span>
                    Se connecter <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="login-divider"></div>

            <div class="login-footer">
                <a href="{{ url_for('team_select') }}"><i class="bi bi-arrow-left me-1"></i>Retour aux équipes</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const card = document.getElementById('loginCard');
            const overlay = document.getElementById('portalOverlay');
            const logo = document.getElementById('portalLogo');

            card.classList.add('fade-out');

            setTimeout(() => {
                overlay.classList.add('active');
                logo.classList.add('active');
            }, 300);

            setTimeout(() => {
                this.submit();
            }, 800);
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            document.querySelectorAll('.orb').forEach(o => {
                o.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
