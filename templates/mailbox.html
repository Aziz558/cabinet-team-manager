{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2>Boîte mail</h2>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Détection des emails</h5>
      <p class="card-text">Lancez la détection des emails non lus et la création automatique de suggestions.</p>
      <button id="processMailbox" class="btn btn-primary">Traiter la boîte mail</button>
      <div id="mailboxResult" class="mt-3"></div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-body">
      <h5 class="card-title">Derniers emails</h5>
      <button id="listMailbox" class="btn btn-secondary mb-2">Lister les derniers emails</button>
      <div id="mailboxList" class="mt-2"></div>
    </div>
  </div>
</div>

<script>
document.getElementById('processMailbox').addEventListener('click', async function() {
  const btn = this;
  const resultDiv = document.getElementById('mailboxResult');
  btn.disabled = true;
  resultDiv.innerHTML = '<div class="alert alert-info">Traitement en cours...</div>';

  try {
    const response = await fetch('/api/mailbox/process', { method: 'POST' });
    const data = await response.json();

    if (data.ok) {
      resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
    } else {
      resultDiv.innerHTML = `<div class="alert alert-danger">Échec : ${data.message}</div>`;
    }
  } catch (error) {
    resultDiv.innerHTML = `<div class="alert alert-danger">Erreur : ${error.message}</div>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('listMailbox').addEventListener('click', async function() {
  const btn = this;
  const resultDiv = document.getElementById('mailboxList');
  btn.disabled = true;
  resultDiv.innerHTML = '<div class="alert alert-info">Chargement...</div>';

  try {
    const response = await fetch('/api/test/mailbox/senders');
    const data = await response.json();

    if (!data.ok) {
      resultDiv.innerHTML = `<div class="alert alert-danger">Échec : ${data.message}</div>`;
      return;
    }

    const samples = data.samples || [];
    if (!samples.length) {
      resultDiv.innerHTML = '<div class="alert alert-warning">Aucun email trouvé.</div>';
      return;
    }

    let html = '<ul class="list-group">';
    for (const s of samples) {
      html += `<li class="list-group-item">
        <strong>${s.subject || '(sans sujet)'}</strong><br>
        <small>De : ${s.from || s.raw_from}</small><br>
        <small>Date : ${s.date || ''}</small><br>
        <small>Autorisé : ${s.allowed ? 'Oui' : 'Non'}</small>
      </li>`;
    }
    html += '</ul>';
    resultDiv.innerHTML = html;
  } catch (error) {
    resultDiv.innerHTML = `<div class="alert alert-danger">Erreur : ${error.message}</div>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
