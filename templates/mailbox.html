{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2>Boîte mail</h2>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Détection des emails</h5>
      <p class="card-text">Lancez la détection des emails non lus et la création automatique de suggestions.</p>
      <button id="processMailbox" class="btn btn-primary">Traiter la boîte mail</button>
      <div id="mailboxResult" class="mt-3"></div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-body">
      <h5 class="card-title">Test de connexion</h5>
      <button id="testMailbox" class="btn btn-secondary">Tester la connexion IMAP</button>
      <div id="mailboxTestResult" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
document.getElementById('processMailbox').addEventListener('click', async function() {
  const btn = this;
  const resultDiv = document.getElementById('mailboxResult');
  btn.disabled = true;
  resultDiv.innerHTML = '<div class="alert alert-info">Traitement en cours...</div>';

  try {
    const response = await fetch('/api/mailbox/process', { method: 'POST' });
    const data = await response.json();

    if (data.ok) {
      resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
    } else {
      resultDiv.innerHTML = `<div class="alert alert-danger">Échec : ${data.message}</div>`;
    }
  } catch (error) {
    resultDiv.innerHTML = `<div class="alert alert-danger">Erreur : ${error.message}</div>`;
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('testMailbox').addEventListener('click', async function() {
  const btn = this;
  const resultDiv = document.getElementById('mailboxTestResult');
  btn.disabled = true;
  resultDiv.innerHTML = '<div class="alert alert-info">Test en cours...</div>';

  try {
    const response = await fetch('/api/test/mailbox', { method: 'POST' });
    const data = await response.json();

    if (data.ok) {
      resultDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
    } else {
      resultDiv.innerHTML = `<div class="alert alert-danger">Échec : ${data.message}</div>`;
    }
  } catch (error) {
    resultDiv.innerHTML = `<div class="alert alert-danger">Erreur : ${error.message}</div>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
