<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Cabinet JMH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #0F0F12;
            --bg-2: #1A1A20;
            --accent-1: #FF8C00;
            --accent-2: #2D9CDB;
            --text-primary: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; color: #FFFFFF; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #FFFFFF !important;
            position: relative;
        }
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
        }
        .blob-1 { width: 380px; height: 380px; background: var(--accent-1); top: -120px; left: -100px; }
        .blob-2 { width: 420px; height: 420px; background: var(--accent-2); bottom: -150px; right: -120px; }
        .reg-card {
            position: relative;
            z-index: 2;
            background: rgba(26,26,32,0.92);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .reg-header { text-align: center; margin-bottom: 26px; }
        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            color: #14130F; font-size: 28px;
            box-shadow: 0 10px 30px rgba(255,140,0,0.4);
        }
        .reg-header h2 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; color: var(--text-primary); }
        .reg-header p { color: var(--text-primary); opacity: 0.6; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--text-primary); }
        .input-premium-custom {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 15px;
            background: rgba(15,15,18,0.6);
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .input-premium-custom::placeholder { color: var(--text-primary); opacity: 0.4; }
        .input-premium-custom:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px rgba(255,140,0,0.15);
            background: rgba(15,15,18,0.8);
        }
        .btn-register {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            font-family: 'Poppins', sans-serif;
            margin-top: 8px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(45,156,219,0.35); }
        .btn-register:active { transform: translateY(0); }
        .alert-custom {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: 500;
        }
        .alert-danger-custom { background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1; }
        .alert-success-custom { background: #eafaf1; color: #1e8449; border: 1px solid #abebc6; }
        .reg-footer { text-align: center; margin-top: 18px; font-size: 14px; }
        .reg-footer a { color: var(--accent-2); text-decoration: none; font-weight: 600; }
        .reg-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="reg-card">
        <div class="reg-header">
            <img src="{{ url_for('static', filename='img/logo-jmh.png') }}" alt="JMH" style="width:64px;height:64px;border-radius:18px;border:2px solid #FF8C00;background:#0F0F12;box-shadow:0 10px 30px rgba(255,140,0,0.4)">
            <h2>Créer un compte</h2>
            <p>Rejoignez votre équipe Cabinet JMH</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert-custom alert-{{ 'danger' if 'danger' in category else 'success' }}-custom">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" class="input-premium-custom" required autofocus>
            </div>
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" class="input-premium-custom" required>
            </div>
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" class="input-premium-custom" required
                       placeholder="vous@cabinet-jmh.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" class="input-premium-custom" required
                       placeholder="••••••••" minlength="4">
            </div>
            <div class="form-group">
                <label for="role">Rôle</label>
                <select id="role" name="role" class="input-premium-custom">
                    <option value="membre">Membre</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn-register">
                Créer le compte <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="reg-footer">
            Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
        </div>
    </div>
</body>
</html>
