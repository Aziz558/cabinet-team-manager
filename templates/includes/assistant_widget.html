<style>
/* Assistant — habillage aligné sur les jetons du design system (plus de #E07A5F) */
#assistantFab{position:fixed;right:20px;bottom:20px;z-index:1050;width:56px;height:56px;border-radius:50%;border:0;background:var(--amber,#ff8c00);color:#17181c;font-size:24px;box-shadow:var(--shadow-orange,0 8px 22px -12px rgba(255,140,0,.55)),var(--shadow-2,0 10px 26px -16px rgba(23,26,31,.18));cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s cubic-bezier(.22,1,.36,1)}
#assistantFab:hover{transform:translateY(-2px) scale(1.03)}
#assistantFab:active{transform:scale(.96)}
#assistantPanel{position:fixed;right:20px;bottom:90px;z-index:1050;width:360px;max-width:calc(100vw - 40px);height:480px;max-height:70vh;display:none;flex-direction:column;background:var(--surface-raised,#fff);color:var(--ink,#171a1f);border:1px solid var(--rule,#e2dbcf);border-radius:var(--r-lg,18px);box-shadow:var(--shadow-3,0 22px 48px -22px rgba(23,26,31,.28));overflow:hidden;font-size:14px}
#assistantPanel.open{display:flex}
#assistantPanel .ap-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--amber,#ff8c00);color:#17181c;font-weight:600}
#assistantPanel .ap-head button{background:none;border:0;color:#17181c;font-size:20px;line-height:1;cursor:pointer}
#assistantMessages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ap-msg{max-width:85%;padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.ap-msg.user{align-self:flex-end;background:var(--amber,#ff8c00);color:#17181c}
.ap-msg.assistant{align-self:flex-start;background:var(--bg-card-hover,#f1f2f5);color:inherit}
.ap-msg.error{align-self:flex-start;background:var(--danger-bg,#fbe9e9);color:var(--danger,#bb3a3a)}
.ap-draft{align-self:stretch;border:1px solid var(--amber-line,rgba(255,140,0,.3));border-radius:10px;padding:10px;background:transparent}
.ap-draft .ap-draft-to{font-weight:600;margin-bottom:4px}
.ap-draft .ap-draft-subject{margin-bottom:6px}
.ap-draft .ap-draft-body{white-space:pre-wrap;margin-bottom:8px;font-size:13px}
.ap-draft .ap-draft-actions{display:flex;gap:6px}
.ap-draft button{padding:4px 10px;border-radius:6px;border:1px solid var(--amber,#ff8c00);background:var(--amber,#ff8c00);color:#17181c;cursor:pointer;font-size:13px}
.ap-draft button.secondary{background:transparent;color:var(--amber-deep,#b8590a)}
.ap-draft button:disabled{opacity:.6;cursor:default}
#assistantForm{display:flex;gap:6px;padding:10px;border-top:1px solid var(--rule,#e2dbcf)}
#assistantForm input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--rule,#e2dbcf);background:var(--bg-card,#fafafb);color:inherit}
#assistantForm button{padding:8px 12px;border-radius:8px;border:0;background:var(--amber,#ff8c00);color:#17181c;cursor:pointer}
#assistantForm button:disabled{opacity:.6}
@media (prefers-reduced-motion: reduce) { #assistantFab:hover, #assistantFab:active { transform: none; } }
</style>
<button id="assistantFab" type="button" aria-label="Ouvrir l'assistant" title="Assistant"><i class="bi bi-chat-dots"></i></button>
<div id="assistantPanel" role="dialog" aria-label="Assistant Orbit">
    <div class="ap-head">
        <strong>Assistant Orbit</strong>
        <button id="assistantClose" type="button" aria-label="Fermer">&times;</button>
    </div>
    <div id="assistantMessages"></div>
    <form id="assistantForm" autocomplete="off">
        <input id="assistantInput" type="text" maxlength="2000" placeholder="Posez une question..." aria-label="Message">
        <button id="assistantSend" type="submit">Envoyer</button>
    </form>
</div>
