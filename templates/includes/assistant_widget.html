<style>
#assistantFab{position:fixed;right:20px;bottom:20px;z-index:1050;width:56px;height:56px;border-radius:50%;border:0;background:#E07A5F;color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center}
#assistantPanel{position:fixed;right:20px;bottom:90px;z-index:1050;width:360px;max-width:calc(100vw - 40px);height:480px;max-height:70vh;display:none;flex-direction:column;background:#fff;color:#111;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden;font-size:14px}
html[data-theme="dark"] #assistantPanel{background:#1b1b20;color:#eee}
#assistantPanel.open{display:flex}
#assistantPanel .ap-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#E07A5F;color:#fff}
#assistantPanel .ap-head button{background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer}
#assistantMessages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.ap-msg{max-width:85%;padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word}
.ap-msg.user{align-self:flex-end;background:#E07A5F;color:#fff}
.ap-msg.assistant{align-self:flex-start;background:#f1f1f4;color:inherit}
html[data-theme="dark"] .ap-msg.assistant{background:#2a2a31}
.ap-msg.error{align-self:flex-start;background:#fde8e8;color:#8a1c1c}
.ap-draft{align-self:stretch;border:1px solid #E07A5F;border-radius:10px;padding:10px;background:transparent}
.ap-draft .ap-draft-to{font-weight:600;margin-bottom:4px}
.ap-draft .ap-draft-subject{margin-bottom:6px}
.ap-draft .ap-draft-body{white-space:pre-wrap;margin-bottom:8px;font-size:13px}
.ap-draft .ap-draft-actions{display:flex;gap:6px}
.ap-draft button{padding:4px 10px;border-radius:6px;border:1px solid #E07A5F;background:#E07A5F;color:#fff;cursor:pointer;font-size:13px}
.ap-draft button.secondary{background:transparent;color:#E07A5F}
.ap-draft button:disabled{opacity:.6;cursor:default}
#assistantForm{display:flex;gap:6px;padding:10px;border-top:1px solid rgba(127,127,127,.25)}
#assistantForm input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(127,127,127,.4);background:transparent;color:inherit}
#assistantForm button{padding:8px 12px;border-radius:8px;border:0;background:#E07A5F;color:#fff;cursor:pointer}
#assistantForm button:disabled{opacity:.6}
</style>
<button id="assistantFab" type="button" aria-label="Ouvrir l'assistant" title="Assistant"><i class="bi bi-chat-dots"></i></button>
<div id="assistantPanel" role="dialog" aria-label="Assistant Orbit">
    <div class="ap-head">
        <strong>Assistant Orbit</strong>
        <button id="assistantClose" type="button" aria-label="Fermer">&times;</button>
    </div>
    <div id="assistantMessages"></div>
    <form id="assistantForm" autocomplete="off">
        <input id="assistantInput" type="text" maxlength="2000" placeholder="Posez une question..." aria-label="Message">
        <button id="assistantSend" type="submit">Envoyer</button>
    </form>
</div>
