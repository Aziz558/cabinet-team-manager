<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur — Cabinet JMH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #F0F7FF 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #2D2D2D; margin: 0;
        }
        .err-card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px; padding: 48px; max-width: 480px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }
        .err-icon {
            width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 18px;
            background: linear-gradient(135deg, #E07A5F, #2D9CDB);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 32px;
        }
        .btn-home {
            margin-top: 24px; padding: 12px 28px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #E07A5F, #2D9CDB); color: #fff;
            font-weight: 700; text-decoration: none; display: inline-block;
        }
        .btn-home:hover { color: #fff; opacity: 0.92; }
    </style>
</head>
<body>
    <div class="err-card">
        <div class="err-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <h2 style="font-family:'Poppins',sans-serif;font-weight:700;">Oups !</h2>
        <p class="text-muted mt-2">{{ message or "Une erreur inattendue s'est produite." }}</p>
        <a href="{{ url_for('login') }}" class="btn-home">Retour à la connexion</a>
    </div>
</body>
</html>
