{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 animate-fade-in-up">
    <h2 class="fw-semibold"><i class="bi bi-bell me-2" style="color:var(--orange-primary)"></i>Notifications</h2>
</div>

<!-- Stats -->
<div class="row mb-4 g-3">
    <div class="col-md-3">
        <div class="card-premium text-center animate-fade-in-up stagger-1">
            <div class="card-body-premium">
                <h3 class="mb-0" id="totalCount" style="color:var(--text-primary);">0</h3>
                <p class="text-tertiary small mb-0">Total</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card-premium text-center animate-fade-in-up stagger-2">
            <div class="card-body-premium">
                <h3 class="mb-0 text-danger" id="unreadCount">0</h3>
                <p class="text-tertiary small mb-0">Non lues</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card-premium text-center animate-fade-in-up stagger-3">
            <div class="card-body-premium">
                <h3 class="mb-0 text-success" id="readCount">0</h3>
                <p class="text-tertiary small mb-0">Lues</p>
            </div>
        </div>
    </div>
    <div class="col-md-3 d-flex align-items-center">
        <button class="btn-premium btn-premium-primary w-100 btn-press" id="markAllReadBtn">
            <i class="bi bi-check-all me-1"></i>Marquer tout comme lu
        </button>
    </div>
</div>

<!-- Filtres -->
<div class="card-premium mb-3 animate-fade-in-up">
    <div class="card-body-premium py-2">
        <div class="d-flex flex-wrap gap-2">
            <button class="btn-premium btn-premium-secondary btn-sm filter-btn active" data-filter="all">Toutes</button>
            <button class="btn-premium btn-premium-secondary btn-sm filter-btn" data-filter="assignation">Assignations</button>
            <button class="btn-premium btn-premium-secondary btn-sm filter-btn" data-filter="prise_en_charge">Prises en charge</button>
            <button class="btn-premium btn-premium-secondary btn-sm filter-btn" data-filter="completion">Terminées</button>
            <button class="btn-premium btn-premium-secondary btn-sm filter-btn" data-filter="systeme">Commentaires</button>
        </div>
    </div>
</div>

<!-- Liste -->
<div id="notificationsList">
    <div class="text-center py-5">
        <div class="spinner-border spinner-sm" style="color:var(--orange-primary);"></div>
        <p class="text-tertiary mt-2">Chargement...</p>
    </div>
</div>

<div id="emptyState" style="display:none;" class="text-center py-5">
    <i class="bi bi-bell-slash" style="font-size:48px;color:var(--text-tertiary);"></i>
    <p class="text-tertiary mt-3">Aucune notification.</p>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
let allNotifs = [];
let currentFilter = 'all';

fetch('/api/notifications').then(r => r.json()).then(data => {
    if (data.notifications) { allNotifs = data.notifications; updateCounts(); renderNotifs(); }
});

function updateCounts() {
    document.getElementById('totalCount').textContent = allNotifs.length;
    document.getElementById('unreadCount').textContent = allNotifs.filter(n => !n.lu).length;
    document.getElementById('readCount').textContent = allNotifs.filter(n => n.lu).length;
}

function getIcon(t) { return {assignation:'bi-envelope-paper',prise_en_charge:'bi-gear-wide',completion:'bi-check-circle',systeme:'bi-chat-dots'}[t]||'bi-bell'; }
function getBadge(t) { return {assignation:'badge-primary',prise_en_charge:'badge-success',completion:'badge-info',systeme:'badge-secondary'}[t]||'badge-secondary'; }

function renderNotifs() {
    const list = document.getElementById('notificationsList');
    const empty = document.getElementById('emptyState');
    let filtered = currentFilter === 'all' ? allNotifs : allNotifs.filter(n => n.type === currentFilter);
    if (filtered.length === 0) { list.style.display = 'none'; empty.style.display = 'block'; return; }
    list.style.display = 'block'; empty.style.display = 'none';
    list.innerHTML = filtered.map(n => `
        <div class="card-premium mb-2 notif-item ${n.lu?'':'border-start border-3 border-warning'}" data-id="${n.id}" onclick="${n.lu?'':'fetch(\'/api/notifications/'+n.id+'/read\',{method:\'POST\'}).then(()=>{location.reload()})'}">
            <div class="card-body-premium d-flex align-items-start gap-3 py-2">
                <div class="flex-shrink-0"><i class="bi ${getIcon(n.type)}" style="font-size:20px;color:${n.lu?'var(--text-tertiary)':'var(--orange-primary)'};"></i></div>
                <div class="flex-grow-1 min-w-0">
                    <div class="d-flex justify-content-between gap-2">
                        <div><span class="badge ${getBadge(n.type)} me-2">${n.type.replace('_',' ')}</span><span class="${n.lu?'':'fw-bold'}">${n.message}</span></div>
                        <small class="text-tertiary flex-shrink-0">${n.date}</small>
                    </div>
                    ${n.tache_id ? `<a href="/vue_tache/${n.tache_id}" class="small text-tertiary mt-1 d-inline-block">Voir la tâche →</a>` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

document.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(x => { x.classList.remove('active'); x.classList.remove('btn-premium-primary'); x.classList.add('btn-premium-secondary'); });
    this.classList.add('active','btn-premium-primary'); this.classList.remove('btn-premium-secondary');
    currentFilter = this.dataset.filter; renderNotifs();
}));

document.getElementById('markAllReadBtn').addEventListener('click', function() {
    this.disabled = true; this.innerHTML = '<span class="spinner-border spinner-sm me-1"></span>...';
    fetch('/api/notifications/mark-all-read', {method:'POST'}).then(r=>r.json()).then(res=>{
        if(res.ok){ allNotifs.forEach(n=>n.lu=true); updateCounts(); renderNotifs(); }
        this.innerHTML='<i class="bi bi-check-all me-1"></i>Tout marqué comme lu'; setTimeout(()=>{this.innerHTML='<i class="bi bi-check-all me-1"></i>Marquer tout comme lu';this.disabled=false;},2000);
    });
});
</script>
{% endblock %}
